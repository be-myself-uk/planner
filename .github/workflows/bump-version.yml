name: Bump Schema Version

on:
  push:
    branches:
      - main
    paths:
      - index.html

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update SCHEMA_VERSION in index.html
        run: |
          # Get the current Unix timestamp
          CURRENT_TIME=$(date +%s)

          # Find the exact line and replace the numbers with the new timestamp
          sed -i -E "s/const SCHEMA_VERSION = [0-9]+;/const SCHEMA_VERSION = $CURRENT_TIME;/g" index.html

      - name: Commit and push the version bump
        run: |
          # Set up the GitHub Actions bot user for the commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          # Check if the file actually changed before trying to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # [no ci] is one of GitHub's recognised skip-CI markers, so this
          # push does not trigger this same workflow again.
          git commit -m "Version bump [no ci]"

          # A repository ruleset on main requires changes to go through a
          # pull request, which this workflow's default token cannot open
          # (GitHub Actions is not permitted to create pull requests in
          # this repository). Until that is changed, a direct push here
          # will keep failing. Fail loudly rather than leaving an orphaned
          # branch behind, as an earlier version of this workflow did.
          if ! git push; then
            echo "::error::Direct push to main was rejected, most likely by a branch protection rule. The version bump was not applied. Either bump SCHEMA_VERSION manually, or fix the underlying permissions (see CONTRIBUTING.md)."
            exit 1
          fi
