name: Bump Schema Version

on:
  push:
    branches:
      - main
    paths:
      - index.html
  workflow_dispatch: {}

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # main's ruleset requires a pull request for the default
          # GITHUB_TOKEN, which is always the github-actions[bot] identity
          # and cannot be added to a ruleset's bypass list. BUMP_VERSION_TOKEN
          # is a fine-grained PAT belonging to a repository admin who is on
          # the bypass list, so pushes authenticated with it go straight
          # through, the same as if that admin had pushed it themselves.
          token: ${{ secrets.BUMP_VERSION_TOKEN }}

      - name: Update SCHEMA_VERSION in index.html
        run: |
          # Get the current Unix timestamp
          CURRENT_TIME=$(date +%s)

          # Find the exact line and replace the numbers with the new timestamp
          sed -i -E "s/const SCHEMA_VERSION = [0-9]+;/const SCHEMA_VERSION = $CURRENT_TIME;/g" index.html

      - name: Commit and push the version bump
        run: |
          # Set up the GitHub Actions bot user for the commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          # Check if the file actually changed before trying to commit
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # [no ci] is one of GitHub's recognised skip-CI markers, so this
          # push does not trigger this same workflow again.
          git commit -m "Version bump [no ci]"

          # This push authenticates as BUMP_VERSION_TOKEN's owner, a
          # bypass-listed admin, so it should go straight through main's
          # ruleset. If it is ever rejected anyway (token expired, revoked,
          # or removed from the bypass list), fail loudly rather than
          # leaving an orphaned branch behind, as an earlier version of
          # this workflow did.
          if ! git push; then
            echo "::error::Direct push to main was rejected. BUMP_VERSION_TOKEN may have expired, been revoked, or its owner removed from main's ruleset bypass list. The version bump was not applied. See CONTRIBUTING.md."
            exit 1
          fi
