name: Check Content

on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch:
    inputs:
      write_source_snapshots:
        description: "source-content-watch: regenerate tests/source-content-snapshots.json instead of checking it. Run on main, it commits the new snapshot to main (using BUMP_VERSION_TOKEN); on any other branch it only uploads it as a build artifact. Use after reviewing a source-changed issue, whether or not anything needed fixing, or after adding a source. Leave unchecked for a normal manual run."
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  issues: write

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Lychee Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--verbose --no-progress --config .github/scripts/lychee.toml './index.html' './README.md' './CHANGELOG.md' './SOURCES.md'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing open issue
        if: steps.lychee.outputs.exit_code != 0
        id: existing
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'broken-links',
              state: 'open'
            });
            core.setOutput('found', issues.data.length > 0 ? 'true' : 'false');
            core.setOutput('number', issues.data.length > 0 ? issues.data[0].number : '');

      - name: Create issue if links are broken
        if: steps.lychee.outputs.exit_code != 0 && steps.existing.outputs.found == 'false'
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "🚨 Broken links detected in the planner"
          content-filepath: ./lychee/out.md
          labels: bug, broken-links

      - name: Comment on existing issue with the new report
        if: steps.lychee.outputs.exit_code != 0 && steps.existing.outputs.found == 'true'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ steps.existing.outputs.number }}
          body-path: ./lychee/out.md

  source-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check GOV.UK sources against their Last verified date
        id: check
        run: |
          set -o pipefail
          python3 .github/scripts/check_source_updates.py | tee -a "$GITHUB_OUTPUT"

      - name: Check for existing open issue
        if: steps.check.outputs.changes_detected == 'true'
        id: existing
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'source-changed',
              state: 'open'
            });
            core.setOutput('found', issues.data.length > 0 ? 'true' : 'false');
            core.setOutput('number', issues.data.length > 0 ? issues.data[0].number : '');

      - name: Create issue if a source may have changed
        if: steps.check.outputs.changes_detected == 'true' && steps.existing.outputs.found == 'false'
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "📄 Possible source changes in SOURCES.md"
          content-filepath: ./source-watch-report.md
          labels: source-changed

      - name: Comment on existing issue with the new report
        if: steps.check.outputs.changes_detected == 'true' && steps.existing.outputs.found == 'true'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ steps.existing.outputs.number }}
          body-path: ./source-watch-report.md

  source-content-watch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright browsers and system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Regenerate source-content-snapshots.json
        if: inputs.write_source_snapshots == true
        run: node source-content-check.js --write

      - name: Commit the regenerated snapshot to main
        if: inputs.write_source_snapshots == true && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.BUMP_VERSION_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- source-content-snapshots.json; then
            echo "The snapshot has not changed."
            exit 0
          fi

          base64 -w0 source-content-snapshots.json > "$RUNNER_TEMP/snapshot.b64"
          jq -n \
            --arg repo "$REPO" \
            --arg head "$(git rev-parse HEAD)" \
            --rawfile contents "$RUNNER_TEMP/snapshot.b64" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                expectedHeadOid: $head,
                message: { headline: "Update the source snapshots [skip ci]" },
                fileChanges: { additions: [ { path: "tests/source-content-snapshots.json", contents: $contents } ] }
              } }
            }' > "$RUNNER_TEMP/request.json"

          if ! gh api graphql --input "$RUNNER_TEMP/request.json" > "$RUNNER_TEMP/response.json"; then
            cat "$RUNNER_TEMP/response.json"
            echo "::error::GitHub refused the snapshot commit. main may have moved on since this run started, or BUMP_VERSION_TOKEN may have expired or been revoked. The new snapshot is attached to this run as an artifact. See CONTRIBUTING.md."
            exit 1
          fi
          echo "Snapshot committed: $(jq -r '.data.createCommitOnBranch.commit.oid // empty' "$RUNNER_TEMP/response.json")"

      - name: Upload regenerated snapshot
        if: always() && inputs.write_source_snapshots == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-content-snapshots
          path: tests/source-content-snapshots.json
          retention-days: 14

      - name: Check sources, including GOV.UK pages, against their last text snapshot
        if: inputs.write_source_snapshots != true
        id: check
        run: |
          set -o pipefail
          node source-content-check.js | tee -a "$GITHUB_OUTPUT"

      - name: Check for existing open issue
        if: inputs.write_source_snapshots != true && steps.check.outputs.changes_detected == 'true'
        id: existing
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'source-changed',
              state: 'open'
            });
            core.setOutput('found', issues.data.length > 0 ? 'true' : 'false');
            core.setOutput('number', issues.data.length > 0 ? issues.data[0].number : '');

      - name: Create issue if a source may have changed
        if: inputs.write_source_snapshots != true && steps.check.outputs.changes_detected == 'true' && steps.existing.outputs.found == 'false'
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "📄 Possible source changes in SOURCES.md"
          content-filepath: ./source-content-report.md
          labels: source-changed

      - name: Comment on existing issue with the new report
        if: inputs.write_source_snapshots != true && steps.check.outputs.changes_detected == 'true' && steps.existing.outputs.found == 'true'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ steps.existing.outputs.number }}
          body-path: ./source-content-report.md
